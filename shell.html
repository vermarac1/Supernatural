<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--pwa-->
<title>Dr. Joe — Scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#08070d;color:#f5f1e8;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  body{display:grid;place-items:center;padding:16px}
  .glow{position:fixed;border-radius:50%;filter:blur(70px);opacity:.6;pointer-events:none}
  .glow.a{width:80vmax;height:80vmax;left:-30vmax;top:-30vmax;background:radial-gradient(circle,#5a3bff 0%,transparent 62%)}
  .glow.b{width:80vmax;height:80vmax;right:-35vmax;bottom:-35vmax;background:radial-gradient(circle,#d92a63 0%,transparent 60%)}
  form{position:relative;width:min(340px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
  h1{font-family:Fraunces,serif;font-weight:600;font-size:40px;letter-spacing:-.5px}
  em{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:20px;color:rgba(245,241,232,.6);margin:-12px 0 18px}
  input{height:50px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:16px;text-align:center;outline:none;backdrop-filter:blur(10px)}
  input:focus{border-color:rgba(245,241,232,.5)}
  button{height:50px;border-radius:999px;border:0;background:#f5f1e8;color:#0b0a10;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6}
  p{min-height:20px;font-size:13px;color:#ff8fb0}
  .hide{visibility:hidden}
</style>
</head>
<body>
<div class="glow a"></div><div class="glow b"></div>
<form id="f" class="hide">
  <h1>Dr. Joe</h1><em>daily scroll</em>
  <input id="p" type="password" placeholder="Passphrase" aria-label="Passphrase" autocomplete="current-password" autocapitalize="off">
  <button id="go">Open</button>
  <p id="m" role="status"></p>
</form>
<script>
(function(){ // wrapped so nothing here clashes with the app's own globals
  const D = __DATA__;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const raw = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const show = html => { document.open(); document.write(html); document.close(); };
  const decrypt = k => crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, k, b64(D.ct)).then(pt => new TextDecoder().decode(pt));
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

  const f = document.getElementById("f"), p = document.getElementById("p"), m = document.getElementById("m"), go = document.getElementById("go");
  const ask = () => { f.classList.remove("hide"); p.focus(); };

  // remembered key: open straight away
  let stored = null; try{ stored = localStorage.getItem("jb_key"); }catch(e){}
  if(stored) crypto.subtle.importKey("raw", b64(stored), "AES-GCM", false, ["decrypt"]).then(decrypt).then(show)
    .catch(() => { try{ localStorage.removeItem("jb_key"); }catch(e){} ask(); }); // passphrase changed since
  else ask();

  f.onsubmit = async e => {
    e.preventDefault(); if(!p.value) return p.focus();
    go.disabled = true; m.textContent = "";
    try{
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(p.value), "PBKDF2", false, ["deriveKey"]);
      const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(D.salt), iterations:D.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
      const html = await decrypt(k);
      try{ localStorage.setItem("jb_key", raw(await crypto.subtle.exportKey("raw", k))); }catch(e){}
      show(html);
    }catch(err){ m.textContent = "That's not it. Try again."; p.select(); go.disabled = false; }
  };
})();
</script>
</body>
</html>
