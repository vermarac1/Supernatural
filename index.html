<style>
  /* every rule is scoped to #lock so nothing can leak into the app after unlock */
  #lock{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:hidden;background:#08070d;color:#f5f1e8;font-family:Inter,system-ui,sans-serif}
  #lock *{box-sizing:border-box;margin:0}
  #lock .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;pointer-events:none}
  #lock .glow.a{width:80vmax;height:80vmax;left:-30vmax;top:-30vmax;background:radial-gradient(circle,#5a3bff 0%,transparent 62%)}
  #lock .glow.b{width:80vmax;height:80vmax;right:-35vmax;bottom:-35vmax;background:radial-gradient(circle,#d92a63 0%,transparent 60%)}
  #lock form{position:relative;width:min(340px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
  #lock h1{font-family:Fraunces,serif;font-weight:600;font-size:40px;letter-spacing:-.5px}
  #lock em{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:20px;color:rgba(245,241,232,.6);margin:-12px 0 18px}
  #lock input{height:50px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:16px;text-align:center;outline:none;backdrop-filter:blur(10px)}
  #lock input:focus{border-color:rgba(245,241,232,.5)}
  #lock button{height:50px;border-radius:999px;border:0;background:#f5f1e8;color:#0b0a10;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  #lock button:disabled{opacity:.6}
  #lock p{min-height:20px;font-size:13px;color:#ff8fb0}
  #lock .hide{visibility:hidden}
</style>
</head>

</form>

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const raw = u => btoa(String.fromCharCode(...new Uint8Array(u)));

  const loaded = document.readyState === "complete" ? Promise.resolve() : new Promise(r => addEventListener("load", r, {once:true}));
  const show = html => loaded.then(() => { document.open(); document.write(html); document.close(); });
  const decrypt = k => crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, k, b64(D.ct)).then(pt => new TextDecoder().decode(pt));
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

  const f = document.getElementById("f"), p = document.getElementById("p"), m = document.getElementById("m"), go = document.getElementById("go");
  const ask = () => { f.classList.remove("hide"); p.focus(); };

  // remembered key: open straight away
  let stored = null; try{ stored = localStorage.getItem("jb_key"); }catch(e){}
  if(stored) (window.__k = stored, crypto.subtle).importKey("raw", b64(stored), "AES-GCM", false, ["decrypt"]).then(decrypt).then(show)
    .catch(() => { try{ localStorage.removeItem("jb_key"); }catch(e){} ask(); }); // passphrase changed since
  else ask();

  f.onsubmit = async e => {
    e.preventDefault(); if(!p.value) return p.focus();
    go.disabled = true; m.textContent = "";
    try{
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(p.value), "PBKDF2", false, ["deriveKey"]);

      window.__k = raw(await crypto.subtle.exportKey("raw", k)); // images are decrypted with the same key
      try{ localStorage.setItem("jb_key", window.__k); }catch(e){}
      show(html);
    }catch(err){ m.textContent = "That's not it. Try again."; p.select(); go.disabled = false; }
  };
